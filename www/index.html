<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1, minimum-scale=1"
    />
    <title>Palawan Wildlife</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #14120e;
        --paper: #f4f6f5;
        --signal: #e04e1a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font-family: Georgia, "Times New Roman", serif;
        background: var(--paper);
        color: var(--ink);
        text-align: center;
      }
      h1 {
        font-family: system-ui, sans-serif;
        font-size: 1.75rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        margin: 0 0 1rem;
      }
      p {
        max-width: 28rem;
        line-height: 1.5;
        opacity: 0.8;
      }
      .dot {
        color: var(--signal);
      }
    </style>
  </head>
  <body>
    <div>
      <h1>Palawan<span class="dot">·</span>Wildlife</h1>
      <p>
        Connecting to the field server… If this stays here, start the Next.js app
        on your computer (<code>npm run dev:mobile</code>) and rebuild the APK
        with your Mac’s Wi‑Fi IP, or set a hosted URL.
      </p>
    </div>
  </body>
</html>
